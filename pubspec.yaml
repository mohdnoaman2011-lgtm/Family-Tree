name: family_tree
description: تطبيق شجرة العائلة
publish_to: "none"
version: 2.3.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  image_picker: ^1.0.7
  google_fonts: ^6.2.1
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ">=8.1.2 <11.0.0"

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F4F0E4"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
