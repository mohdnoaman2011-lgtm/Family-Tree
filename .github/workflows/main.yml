name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المستودع يحتوي lib/ و pubspec.yaml فقط، فنولّد مجلد android تلقائياً
      - name: Generate Android platform files
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name family_tree .
          cp /tmp/main.dart lib/main.dart
          rm -rf test

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-apk
          path: build/app/outputs/flutter-apk/app-release.apk
